services:
  postgres:
    image: postgres:17-alpine
    container_name: shoe-postgres
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shoe
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shoe"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: shoe-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes: ["miniodata:/data"]

  redis:
    image: redis:7-alpine
    container_name: shoe-redis
    restart: unless-stopped
    # Persistence is not the default, and the default is wrong here: a queued
    # verification email that a restart silently drops is worse than no queue
    # at all. AOF fsyncs once a second, so the worst case is a second of jobs.
    command: redis-server --appendonly yes --appendfsync everysec
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: shoe-mailpit
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_DATABASE: /data/mailpit.db
    volumes: ["mailpitdata:/data"]

volumes: { pgdata: {}, miniodata: {}, redisdata: {}, mailpitdata: {} }
