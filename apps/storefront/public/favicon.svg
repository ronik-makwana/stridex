<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StrideX">
  <title>StrideX</title>
  <style>
    /* The mark carries its own ground so it stays legible against light or dark
       browser chrome. Colours are the storefront's --foreground / --background,
       written literally: a favicon renders outside the document and cannot read
       CSS variables from it. */
    .tile { fill: #ffffff; stroke: #0f0f11; }
    .mark { fill: #0f0f11; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0f0f11; stroke: #ffffff; }
      .mark { fill: #ffffff; }
    }
  </style>
  <rect class="tile" x="3" y="3" width="58" height="58" rx="3" stroke-width="6" />
  <text class="mark" x="33.5" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="29" font-weight="700" letter-spacing="3">SX</text>
</svg>
