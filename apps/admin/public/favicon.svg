<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StrideX Admin">
  <title>StrideX Admin</title>
  <style>
    /* Inverted against the storefront's mark on purpose: admin and storefront
       are usually open in adjacent tabs, and a filled tile tells them apart at
       16px where two letters cannot. Colours are this app's --primary /
       --primary-foreground, written literally — a favicon renders outside the
       document and cannot read CSS variables from it. */
    .tile { fill: #18181b; }
    .rule { fill: none; stroke: #fafafa; }
    .mark { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .rule { stroke: #18181b; }
      .mark { fill: #18181b; }
    }
  </style>
  <rect class="tile" x="0" y="0" width="64" height="64" rx="6" />
  <rect class="rule" x="9" y="9" width="46" height="46" rx="2" stroke-width="3.5" />
  <text class="mark" x="33.1" y="32.5" text-anchor="middle" dominant-baseline="central"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="700" letter-spacing="2.2">SX</text>
</svg>
