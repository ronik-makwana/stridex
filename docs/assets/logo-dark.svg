<svg xmlns="http://www.w3.org/2000/svg" width="322" height="90" viewBox="0 0 322 90" role="img" aria-label="StrideX">
  <title>StrideX</title>
  <!--
    The dark-theme twin of `logo-light.svg`: same geometry, inverted ink, so the
    mark stays legible on GitHub's dark background. The README picks between the
    two with a `picture` element keyed on `prefers-color-scheme`; an SVG loaded
    as an image cannot read the host page's theme itself.
  -->
  <rect x="3" y="3" width="316" height="84" rx="8" fill="none" stroke="#f5f5f5" stroke-width="6" />
  <text x="161" y="62" fill="#f5f5f5" text-anchor="middle" textLength="252" lengthAdjust="spacing"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="600">STRIDEX</text>
</svg>
