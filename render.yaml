# Render Blueprint — the API and its Redis, on the free plan.
#
# What is deliberately NOT here:
#
#   Postgres. Render's free Postgres is deleted 30 days after creation, which
#   for a portfolio project means the demo dies a month after anyone links to
#   it. The database lives on Neon instead (free, no expiry, resumes from idle
#   in well under a second), and `DATABASE_URL` is pasted in below.
#
#   A worker service. Render background workers start at the paid tier, so the
#   worker runs inside the API process via RUN_WORKER_INLINE. That is safe here
#   and only here: the free plan runs exactly one instance, and the reason the
#   worker was split out was N instances each running N sweeps. One instance,
#   one worker, no overlap.
#
# The two static sites are on Vercel rather than here — see apps/*/vercel.json
# for why (the SPAs proxy /api to this service so the session cookie stays
# same-origin).

services:
  - type: web
    name: stridex-api
    runtime: node
    plan: free
    # Ohio, because the Neon project — Postgres *and* object storage — is in
    # us-east-2, and Neon Object Storage is only offered in us-east-2 and
    # eu-central-1. Putting the API nearer an INR audience would put it a
    # Pacific round trip away from its own database on every query, which costs
    # far more than the last mile to the browser does.
    region: ohio
    branch: main
    healthCheckPath: /health

    # `--include=dev` is load-bearing. Render sets NODE_ENV=production for Node
    # services, and `npm ci` then skips devDependencies — which is where tsup,
    # prisma and typescript live. Without the flag the build fails on a missing
    # binary rather than on anything real.
    #
    # Migrations run here rather than at start-up so that a bad migration fails
    # the deploy and leaves the previous version serving, instead of crash-
    # looping a released instance.
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run build:api
    startCommand: node apps/api/dist/server.js

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is injected by Render. Setting it here would override the port the
      # platform is actually routing to, and the service would never pass a
      # health check.

      - key: DATABASE_URL
        sync: false # Neon → Connection string (the pooled one)

      - key: REDIS_URL
        fromService:
          # Required by the blueprint validator, whatever the docs example
          # shows: without it, "services[0].envVars[2].fromService.type — empty
          # but required".
          type: keyvalue
          name: stridex-keyvalue
          property: connectionString

      # Generated once, by Render, and never seen by anyone. Rotating them logs
      # every session out, which is the intended effect of rotating them.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # One instance on the free plan, so the worker rides along. See the note
      # at the top of this file before changing it.
      - key: RUN_WORKER_INLINE
        value: true

      # ─── object storage (Neon Object Storage) ─────────────────────────────
      #
      # The bucket is created public_read in the Neon Console, once, and this
      # process must not try to manage it: Neon returns 501 for
      # PutBucketPolicy, and `ensureBucket` is awaited by every upload.
      #
      # Access level is Console-only — there is no CLI or S3 call that changes
      # it — so a bucket created without --access-level public_read serves 403
      # to every visitor while the API itself works perfectly.
      - key: S3_MANAGED_BUCKET
        value: true
      - key: S3_REGION
        value: us-east-2
      - key: S3_ENDPOINT
        sync: false # https://<branch-id>.storage.c-1.us-east-2.aws.neon.tech
      - key: S3_BUCKET
        sync: false # stridex
      - key: S3_ACCESS_KEY
        sync: false # nak_live_…
      - key: S3_SECRET_KEY
        sync: false # nsk_live_…
      # The same host as S3_ENDPOINT plus the bucket. Neon serves public objects
      # path-style, so the bucket segment belongs here and not in the endpoint.
      - key: S3_PUBLIC_URL
        sync: false # https://<branch-id>.storage.c-1.us-east-2.aws.neon.tech/stridex

      # ─── where the SPAs live ──────────────────────────────────────────────
      #
      # These build the links inside email, so they are the Vercel URLs a
      # customer clicks — not this service's URL.
      - key: STOREFRONT_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      # Same two origins. The browser never actually needs these while the SPAs
      # proxy /api through their own domain, but anything calling this service
      # directly does, and a wrong value here fails in a way that looks like an
      # auth bug.
      - key: CORS_ORIGINS
        sync: false

      # ─── payments ─────────────────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false # rzp_test_*
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false # from the webhook, not the key. They are different strings.
      - key: RAZORPAY_DISPLAY_NAME
        value: StrideX

      # ─── mail ─────────────────────────────────────────────────────────────
      #
      # Required in production: with SMTP_HOST empty the app logs every
      # verification link and delivers none, and every job still reports
      # success. Brevo's free tier is 300/day and verifies a single sender
      # address without owning a domain.
      - key: SMTP_HOST
        sync: false # smtp-relay.brevo.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false # must not be @stridex.local — boot refuses it

      - key: LOG_LEVEL
        value: info

  # Redis, not Upstash.
  #
  # Upstash's free tier is 500K commands/month, and BullMQ does not spend
  # commands per job — it spends them per poll. Two workers blocking on their
  # queues burn roughly a million a month sitting completely idle, so the free
  # tier would lapse within days of deploying and the API refuses to boot
  # without Redis. Render's free Key Value has no command cap.
  #
  # It also has no persistence, which is survivable: schedulers are re-created
  # from the registry on every boot (`syncSchedulers`), the cache refills from
  # Postgres, and the rate limiters start empty. The one real loss is queued
  # mail at the moment of a restart.
  - type: keyvalue
    name: stridex-keyvalue
    plan: free
    # Must match the web service's region, or every cache read and every queue
    # poll pays a cross-region round trip.
    region: ohio
    # Free instances are reachable only from inside the Render network, which
    # is what an empty allow list means here.
    ipAllowList: []
