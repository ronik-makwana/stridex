name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first: the older run is
# reporting on code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, build
    runs-on: ubuntu-latest

    env:
      # `prisma generate` reads the URL through `prisma.config.ts`. Nothing here
      # opens a connection — a `pg.Pool` does not dial until its first query —
      # so this needs to exist rather than to work. It names a closed port on
      # purpose: anything that did try to query fails loudly instead of finding
      # a real database.
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/ci_never_connects

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before anything that reads types. `packages/db/src/generated` is
      # gitignored, so on a fresh clone the Prisma client does not exist and
      # every `tsc` would fail on the import rather than on anything real.
      - name: Generate the Prisma client
        run: npm run db:generate

      - run: npm run lint

      # `npm run format:check` is deliberately NOT a step yet.
      #
      # Prettier agrees with this codebase's style — a formatted file
      # round-trips unchanged — but it would still rewrite a few hundred files
      # on first contact. That is a real diff to make, and it should be its own
      # commit so `git blame` has one revision to skip.
      #
      # To adopt it: run `npm run format`, commit it alone, record the SHA in
      # `.git-blame-ignore-revs`, then add the step back here.

      - run: npm run typecheck

      # Catches what a typecheck cannot: a Vite config that fails to resolve, a
      # bad import in a route only the bundler walks.
      - name: Build
        run: |
          npm run build:api
          npm run build:admin
          npm run build:shop
